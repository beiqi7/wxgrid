<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乡镇天气预报</title>
<meta name="description" content="乡镇级精细化天气预报：ECMWF IFS + NOAA GFS 降尺度，GEFS 集合降水概率">
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/styles.css">
<!-- apply the saved theme before first paint so night mode does not flash white -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('wxgrid-theme')||'day'}catch(e){}</script>
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<header class="bar">
  <div class="bar-in">
    <a class="mark" href="/">
      <span class="mark-dot" aria-hidden="true"></span>
      <span class="mark-txt">wxgrid</span>
      <span class="mark-sub">乡镇精细化预报</span>
    </a>
    <div class="bar-right">
      <select id="runs" class="runs" aria-label="选择起报时次" hidden></select>
      <button id="theme" class="theme-btn" type="button"></button>
    </div>
  </div>
</header>

<main>
  <!-- 1. today at the county seat -->
  <section id="today" class="today" aria-live="polite">
    <p class="boot">正在读取预报…</p>
  </section>

  <!-- 2. alerts -->
  <section id="alerts" class="alerts" aria-label="预警提示" hidden></section>

  <!-- 3. five days -->
  <section class="band" aria-labelledby="h-days">
    <div class="bhead">
      <h2 id="h-days" class="btitle">未来五天</h2>
      <p class="bsub">全县范围：气温取乡镇极值，降水取乡镇最大，点一天看各乡镇</p>
    </div>
    <div id="rail" class="rail" aria-label="选择日期"></div>
  </section>

  <!-- 4. townships, the actual product -->
  <section class="band" aria-labelledby="h-towns">
    <div class="bhead">
      <h2 id="h-towns" class="btitle">各乡镇</h2>
      <p id="towns-when" class="bsub"></p>
    </div>
    <div id="towns" class="towns"></div>
    <p class="note">气温已按 −6.5 K/km 递减率从模式地形订正到乡镇实际海拔，所以同一天高山乡镇更凉。点一行看该乡镇五天详情。</p>
  </section>

  <!-- 5. secondary material, folded -->
  <section class="band">
    <details class="fold">
      <summary><span>预报文稿</span><span class="fold-hint">与命令行输出一致的纯文本</span></summary>
      <div class="fold-in">
        <button id="copy-doc" class="mini" type="button">复制全文</button>
        <pre id="doc-text" class="doc"></pre>
      </div>
    </details>

    <details class="fold">
      <summary><span>数据接口</span><span class="fold-hint">只读 JSON，无需鉴权</span></summary>
      <div class="fold-in">
        <div id="api-list" class="apis"></div>
        <pre id="api-curl" class="doc doc-sm"></pre>
      </div>
    </details>
  </section>
</main>

<!-- township detail -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button id="sheet-close" class="sheet-x" type="button" aria-label="关闭">&times;</button>
    <div id="sheet-body"></div>
  </div>
</div>

<footer class="foot">
  <p id="foot" class="foot-in"></p>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
