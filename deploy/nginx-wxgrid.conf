# nginx in front of wxgrid-web: TLS, per-client rate limit, a short response cache.
#
#   install -m644 deploy/nginx-wxgrid.conf /etc/nginx/conf.d/wxgrid.conf
#   # edit server_name and the certificate paths (e.g. `certbot --nginx -d wx.example.com`)
#   nginx -t && systemctl reload nginx
#
# Then bind wxgrid-web to loopback only (--host 127.0.0.1 in wxgrid-web.service) so
# port 8790 is no longer reachable from outside. The API stays public and read-only;
# this adds encryption, keeps one client from hogging the single Python process, and
# lets nginx answer most requests from its cache.

limit_req_zone $binary_remote_addr zone=wxgrid_api:10m rate=10r/s;
proxy_cache_path /var/cache/nginx/wxgrid levels=1:2 keys_zone=wxgrid:10m max_size=200m inactive=2h
                 use_temp_path=off;

upstream wxgrid_web {
    server 127.0.0.1:8790;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name wx.example.com;                       # <- your domain
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                         # nginx >= 1.25.1; older: "listen 443 ssl http2;"
    server_name wx.example.com;                       # <- your domain

    ssl_certificate     /etc/letsencrypt/live/wx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wx.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Always fetch gzip from upstream (one cache entry per URL); nginx unzips for the
    # rare client that does not accept it. gunzip is built into the Debian/Ubuntu
    # nginx packages; on a build without it, drop both lines.
    proxy_set_header Accept-Encoding gzip;
    gunzip on;

    location /api/ {
        limit_req zone=wxgrid_api burst=40 nodelay;
        limit_req_status 429;

        proxy_cache wxgrid;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_lock on;                          # one upstream fetch per URL at a time
        # Freshness comes from the upstream Cache-Control: 300 s for latest/summary,
        # 1 h for a stored run, no-store for /api/health and errors.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # (no add_header here: one in a location drops the server-level security headers)
        proxy_pass http://wxgrid_web;
    }

    # Health goes straight through, uncached, so a monitor sees the real state.
    location = /api/health {
        proxy_pass http://wxgrid_web;
    }

    location / {
        # Page and static files: small, revalidated by ETag upstream.
        proxy_pass http://wxgrid_web;
    }
}
